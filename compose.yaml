services:
  coordinator:
    build:
      context: ./coordinator
    environment:
      PORT: "8080"
      COORDINATOR_API_KEY: "${COORDINATOR_API_KEY:?COORDINATOR_API_KEY is required}"
      VLLM_BASE_URL: "${VLLM_BASE_URL:?VLLM_BASE_URL is required}"
      ASR_ENCODER_PATH: /models/encoder-epoch-99-avg-1.int8.onnx
      ASR_DECODER_PATH: /models/decoder-epoch-99-avg-1.onnx
      ASR_JOINER_PATH: /models/joiner-epoch-99-avg-1.int8.onnx
      ASR_TOKENS_PATH: /models/tokens.txt
    volumes:
      - "${ASR_MODEL_DIR:?ASR_MODEL_DIR is required}:/models:ro"
    ports:
      - "${COORDINATOR_PORT:?COORDINATOR_PORT is required}:8080"
    depends_on:
      vllm:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 2s
      retries: 5

  vllm:
    build:
      context: ./vllm
    environment:
      PORT: "8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')",
        ]
      interval: 5s
      timeout: 2s
      retries: 5
